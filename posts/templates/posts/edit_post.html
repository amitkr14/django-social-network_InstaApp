{% extends 'users/base.html' %}

{% block body %}
<div class="max-w-2xl mx-auto mt-10 px-4 mb-20">
    <div class="bg-white p-8 rounded-lg shadow-md border border-gray-100">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">Edit Post</h2>
        
        <div class="mb-6">
            <img src="{{ post.image.url }}" alt="Post Preview" class="h-48 w-48 object-cover rounded shadow-sm">
        </div>

        <form method="post" action="">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="id_title">Title</label>
                {{ form.title }}
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="id_caption">Caption</label>
                {{ form.caption }}
            </div>

            <div class="flex items-center justify-between">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded focus:outline-none transition">
                    Save Changes
                </button>
                <a href="{% url 'feed' %}" class="text-gray-500 hover:text-gray-700 font-semibold transition">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
